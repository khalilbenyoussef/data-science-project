# Configuration centrale du pipeline BIFlow (chemins relatifs à la racine du projet)

project:
  name: BIFlow
  domain: "Economy & Finance / Inclusion financière"
  objective: >
    Automatiser la collecte, le profilage, le controle qualite et l'ETL
    des donnees Findex (demande), FAS (offre) et WDI (contexte macro).

paths:
  profiles: outputs/profiles
  reports: outputs/reports
  logs: outputs/logs
  staging: data/staging
  processed: data/processed
  quality: data/quality
  audit: data/audit                # rapport d'audit, explications, evaluation

# --------------------------------------------------------------------------- LLM
llm:
  enabled: true
  temperature: 0
  max_retries: 2
  max_calls_per_agent: 5          # garde-fou anti-boucle / anti-coût
  cache_dir: outputs/llm_cache    # cache disque des réponses (pickle)
  # Agents sans appel LLM : leurs notes/diagnostics utilisent le fallback deterministe
  disabled_agents: [collector, profiler]
  providers:
    gemini:
      type: google
      model: gemini-3.5-flash
    groq:
      type: groq
      model: openai/gpt-oss-120b
  # ordre = primaire puis fallbacks ; les providers sans clé sont ignorés
  # collector, profiler et etl sont 100 % deterministes : aucun LLM
  routing:
    quality:      [groq, gemini]
    analyst:      [groq, gemini]
    auditor:      [groq, gemini]   # reformulation seulement, verifiee (grounding)
    mapper:       [groq, gemini]   # roles de colonnes des sources utilisateur, re-valides
    ask:          [groq, gemini]   # Ask Finova : conversation + outils sur les faits (grounding)
  ask:                             # Ask Finova (POST /api/ask)
    temperature: 0.2
    max_calls_per_session: 30      # appels LLM par session de navigateur ; au-dela : mode simple
    max_tool_steps: 4              # appels LLM par tour (outils compris), hors regeneration
    history_turns: 10              # derniers messages de la session transmis au LLM

# --------------------------------------------------------------------------- Orchestrateur
orchestrator:
  max_retries: 1                   # nouvel essai d'un agent en erreur (jamais pour un gate FAIL)
  retry_backoff_s: 1.0             # attente avant l'essai n (n x backoff)

# --------------------------------------------------------------------------- Auditor
auditor:                           # etape S12 : verification independante des KPI
  tolerance: 1.0e-9                # ecart absolu maximal valeur publiee / recalculee
  min_meaningful_change_pp: 2.0    # variation d'une vague sous ce seuil : "dans le bruit d'enquete"
  llm_examples: 3                  # explications reformulees par LLM (budget d'appels)

# --------------------------------------------------------------------------- Sources utilisateur
uploads:                           # python main.py add-source --file X.csv --name N
  dir: data/uploads                # copies des fichiers (jamais une source officielle)
  mappings_dir: config/sources     # mappings confirmes, charges automatiquement
  max_file_mb: 200                 # taille maximale d'un fichier ajoute
  pending_dir: outputs/uploads_pending  # page « Mes données » : depots en attente de confirmation
  jobs_dir: outputs/jobs           # etat des recalculs (relu apres rechargement ou redemarrage)
  job_timeout_min: 15              # au-dela, le recalcul se termine en erreur

countries:
  name_to_iso3: {}                 # alias de noms de pays confirmes (ex. "Tunisie (centre)": TUN)

# --------------------------------------------------------------------------- Snapshots
snapshots:                         # versions des sources brutes (blobs dedupliques par SHA-256)
  enabled: true
  root: data/snapshots             # index.json, blobs/<sha256>.<ext>, vN/manifest.json

# --------------------------------------------------------------------------- KPI
kpi:                               # etape semantic_kpi du pipeline (apres l'ETL)
  focus: TUN                       # pays focus
  peers: [DZA, EGY, JOR, MAR]      # groupe de pairs (ligne PEERS = moyenne non ponderee)

# --------------------------------------------------------------------------- Collecte
collector:
  api_base: "https://api.worldbank.org/v2"
  country: all                     # toutes les économies (agrégats inclus, ex. WLD pour le monde)
  date_range: "2000:2024"          # période par défaut, surchargée par source si besoin
  per_page: 20000                  # nb max d'observations par page de l'API
  timeout: 60
  retries: 3
  refresh: false                   # false : réutilise le CSV local s'il existe déjà

profiler:
  high_missing_threshold: 0.8      # colonne "quasi vide" au-dessus de ce taux de NaN
  metadata_text_length: 150        # colonne texte longue = métadonnée
  isolation_forest_contamination: 0.02
  enable_isolation_forest: true    # desactive si scikit-learn indisponible (policy DLL)

quality:
  min_rows: 100                    # source suspecte en dessous
  max_duplicate_pct: 0.5           # % de lignes dupliquees tolere
  max_missing_cells_pct: 55        # au-dela : penalite forte (Findex ~49 %, FAS ~39 % structurels)
  max_missing_column_pct: 99.5     # colonne quasi vide
  score_threshold: 0.7             # seuil du quality gate
  rate_columns_min: 0.0
  rate_columns_max: 1.0
  fas_pct_gdp_threshold: 1000.0    # diagnostic uniquement : aucun effet sur le score/gate

etl:
  min_year: 2011                   # periode d'analyse commune aux 3 sources
  max_year: 2024
  findex_total_group: all          # valeur de group2 pour la population totale
  output_format: parquet
  write_csv_copy: true

sources:
  findex:                          # World Bank Global Findex (demande / usage) - source STATIQUE
    type: csv
    static: true                   # fichier local fourni, jamais réécrit par le Collector
    path: data/raw/findex.csv
    date_range: "2011:2024"
    indicators:                    # colonnes de valeurs du fichier Findex
      - account_t_d
      - fiaccount_t_d
      - mobileaccount_t_d
      - inactive_t_d
      - dig_acc                    # compte permettant des paiements numeriques (pas un taux de paiement)
      - save_any_t_d
      - borrow_any_t_d
      - merchant_pay
      - g20_any                    # paiement numerique effectue ou recu dans l'annee (pas seulement les remises)
      - fin17a
      - fin22a
      - fin24aP
      - fin24sav
      - fin24bor
      - fin11a                     # raisons de ne pas avoir de compte bancaire (part de tous
      - fin11b                     # les adultes 15+, glossaire Findex 2025 lignes 6-11) ;
      - fin11c                     # observees pour la vague 2024 seulement
      - fin11d
      - fin11e
      - fin11f
  fas:                            # IMF Financial Access Survey (offre) - source STATIQUE
    type: csv
    static: true                   # fichier local fourni, jamais réécrit par le Collector
    path: data/raw/fas.csv
    date_range: "2004:2024"
    header_marker: SERIES_CODE     # le fichier FAS a deux lignes d'en-tête
    api:                           # collecte optionnelle IMF Data API (SDMX 3.0), desactivee par defaut
      enabled: false               # true : remplace fas.csv par api.path (series ci-dessous uniquement)
      base_url: "https://api.imf.org/external/sdmx/3.0/data/dataflow/IMF.STA/FAS/~/"
      accept: text/csv
      countries: "*"               # premiere dimension de la cle (pays)
      path: data/raw/fas_api.csv   # sortie au format large de fas.csv (SERIES_CODE + annees)
      # serie locale (FAS 5.0.0) -> reste de la cle SDMX (FAS 8.0.0). Verifiees le
      # 2026-10-29 : valeurs TUN 2019-2023 identiques a fas.csv. Les autres series
      # (depots, prets, emprunteurs, % PIB) ne sont pas mappees tant que non verifiees.
      series:
        FA26N.PHTADLT_NUM: FA26._Z._Z._T.PHTADLT_NUM.A
        FA18N.PHTADLT_NUM: FA18._Z._Z._T.PHTADLT_NUM.A
    # suffixe de SERIES_CODE (apres ISO3.) -> indicateur canonique
    series:
      branch_density: FA26N.PHTADLT_NUM          # agences / 100 000 adultes
      atm_density: FA18N.PHTADLT_NUM             # ATM / 100 000 adultes
      depositors_per_1k: FA29N_COMBANK.PTADLT_NUM    # deposants banques / 1 000 adultes
      borrowers_per_1k: FA21N_COMBANK.PTADLT_NUM     # emprunteurs banques / 1 000 adultes
      loan_accounts_per_1k: LOANACCN_COMBANK.PTADLT_NUM
      deposit_accounts_per_1k: FA30N_COMBANK.PTADLT_NUM
      deposits_pct_gdp: OUTD_COMBANK.POGDP       # encours des depots / PIB (% deja calcule)
      loans_pct_gdp: OUTL_COMBANK.POGDP          # encours des prets / PIB (% deja calcule)
  gdp:                             # PIB mondial (World Bank WDI) - source DYNAMIQUE
    type: csv
    dynamic: true                  # rafraîchie via hash SHA-256 (data/raw/gdp.csv.sha256)
    path: data/raw/gdp.csv
    indicators:
      - NY.GDP.MKTP.CD             # PIB (USD courants)
      - NY.GDP.PCAP.CD             # PIB par habitant (USD courants)
      - NY.GDP.MKTP.KD.ZG          # croissance du PIB (% annuel, prix constants 2015)

# ------------------------------------------------------------------- Route 2
# Analyse et dashboard deterministes : aucun appel LLM, lecture seule du DW.
analyst:
  default_countries: [TUN, MAR, DZA]
  default_kpis: [account_ownership, branch_density, digital_payment_rate,
                 saving_rate, borrowing_rate, unbanked_share]
  top_n: 10                        # constats max par code dans le rapport
  trend_epsilon: 0.01              # seuil "stable" (points de % ou unite native)
  narrate: false                   # narration LLM optionnelle, chiffres verifies

dashboard:
  data_output: dashboard/public/data/dashboard.json
  spec_output: dashboard_app/public/data/finova.json
  history_dir: outputs/dashboard/history
  generated_dir: outputs/dashboard/generated   # cache disque des vues generees (API)
  pregenerate_peers: true          # apres run_route2 : vues des pairs pour l'annee publiee
  reference_path: config/reference/finova_reference.yaml
  default_country: TUN
  default_mode: latest
  default_year: 2024
