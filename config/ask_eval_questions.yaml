  - {id: q06, iso3: TUN, year: 2024, page: exclusion, question: "Pourquoi les adultes n'ont-ils pas de compte ?"}
  - {id: q07, iso3: TUN, year: 2024, page: inclusion, question: "Quelle part des adultes épargne auprès d'une institution financière ?"}
