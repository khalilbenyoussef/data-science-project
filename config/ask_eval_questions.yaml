# Questions fixes du controle « en direct » d'Ask Finova (scripts/evaluate_agents.py --ask-live).
# Chaque question est envoyee a POST /api/ask pour le pays et l'annee indiques ; une reponse
# est fondee si chacun de ses nombres figure dans les faits FinOVA (pays focus et pairs,
# meme annee) ou est une annee. Sans cle LLM : « non mesure ».
