[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biflow"
version = "0.1.0"
description = "BIFlow - pipeline BI multi-agents automatise (LangGraph + LLM)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "pyyaml>=6.0",
    "pyarrow>=17.0",
    "openpyxl>=3.1",
    "pycountry>=24.6",
    "duckdb>=1.1",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "langgraph>=1.0",
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-google-genai>=2.0",
    "langchain-groq>=0.3",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.40", "plotly>=5.24"]
dev = ["pytest>=8.0"]

[project.scripts]
biflow = "main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
